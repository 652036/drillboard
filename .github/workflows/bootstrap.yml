name: Bootstrap Drillboard source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Normalize, verify, and unpack source
        run: |
          # Base64 ignores whitespace, but normalize each transport chunk so its
          # exact content can be verified independently before reconstruction.
          for file in .bootstrap/part-*; do
            tr -d '[:space:]' < "$file" > "$file.clean"
            mv "$file.clean" "$file"
          done
          cat > /tmp/parts.sha <<'EOF'
          54d1b36b0a854e0955f81c3aa589be805abae79bf1b3934d982313d72da34831  .bootstrap/part-00
          9f9bb5003d0ef3c311545d5ece1af90fc5aa6c41a1286ae962eb2c214f122fbf  .bootstrap/part-01
          a10d5f187fbcc1d4e19cf689949cef226b7b80edcf82b0f5e6ea99af204ea198  .bootstrap/part-02
          99a5813be2d21a0a25494dd9a4909865475074d6f167d50ab4aeaeb4f8d2a56e  .bootstrap/part-03
          8647e333123203ed21a9ce26b8c18de4eabad73ee84993fcfd99dccaee1f2060  .bootstrap/part-04
          EOF
          sha256sum --check /tmp/parts.sha
          cat .bootstrap/part-* > /tmp/source.b64
          base64 --decode /tmp/source.b64 > /tmp/source.zip
          echo "14bc8f3c016670375c2ec31d4750e8a6f6509d4e6436bd4c842337b03e38919a  /tmp/source.zip" | sha256sum --check -
          rm -rf /tmp/source
          mkdir -p /tmp/source
          unzip -q /tmp/source.zip -d /tmp/source
          cp -a /tmp/source/. .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: ship Drillboard WebMCP exercise simulator"
          git push
