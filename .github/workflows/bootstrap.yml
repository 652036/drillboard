name: Bootstrap Drillboard source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Normalize, verify, and unpack source
        run: |
          files=(
            .bootstrap/part-00-0
            .bootstrap/part-00-1
            .bootstrap/part-00-2-0
            .bootstrap/part-00-2-1
            .bootstrap/part-00-2-2
            .bootstrap/part-00-2-3
            .bootstrap/part-01
            .bootstrap/part-02
            .bootstrap/part-03-0
            .bootstrap/part-03-1
            .bootstrap/part-03-2
            .bootstrap/part-04
          )
          for file in "${files[@]}"; do
            tr -d '[:space:]' < "$file" > "$file.clean"
            mv "$file.clean" "$file"
          done

          cat > /tmp/parts.sha <<'EOF'
          76a5eb47385a4b17beba38073ac8443fdf3f97446ff7323d1dc46bac86f63a80  .bootstrap/part-00-0
          2517d998ab60db9a008ebaaf8a71d7d3c5fd8b3ccafc19d940b31f9063e51b27  .bootstrap/part-00-1
          b50575b08cb63052073a90f022e26caa5d3724459e52b43bd4e2a5cfa4b58a87  .bootstrap/part-00-2-0
          22de14aa2d16f904ae3512966c19f5b890a4099b0ab9cec2d19591491cf8879f  .bootstrap/part-00-2-1
          9316f048a98e8ecf881f32713077de9a144ff838ada682e82f392ad8ea680a34  .bootstrap/part-00-2-2
          33865633e13b360857912cde7420b2ca56dabeef1c703c46a28b5bb83f33168b  .bootstrap/part-00-2-3
          9f9bb5003d0ef3c311545d5ece1af90fc5aa6c41a1286ae962eb2c214f122fbf  .bootstrap/part-01
          a10d5f187fbcc1d4e19cf689949cef226b7b80edcf82b0f5e6ea99af204ea198  .bootstrap/part-02
          9f6245402715bde0024df2cf0c319b46d33f1436536debfd6f0d624545b7b46d  .bootstrap/part-03-0
          7da662e7180207e586d05d549535805ca4d5e5339cd40e59d7a7b948e89e6de0  .bootstrap/part-03-1
          6b86726829a3be276fcc1c36768c945306bb7341814615e7196ba2530786855f  .bootstrap/part-03-2
          8647e333123203ed21a9ce26b8c18de4eabad73ee84993fcfd99dccaee1f2060  .bootstrap/part-04
          EOF
          sha256sum --check /tmp/parts.sha

          cat \
            .bootstrap/part-00-0 \
            .bootstrap/part-00-1 \
            .bootstrap/part-00-2-0 \
            .bootstrap/part-00-2-1 \
            .bootstrap/part-00-2-2 \
            .bootstrap/part-00-2-3 \
            .bootstrap/part-01 \
            .bootstrap/part-02 \
            .bootstrap/part-03-0 \
            .bootstrap/part-03-1 \
            .bootstrap/part-03-2 \
            .bootstrap/part-04 > /tmp/source.b64

          base64 --decode /tmp/source.b64 > /tmp/source.zip
          echo "14bc8f3c016670375c2ec31d4750e8a6f6509d4e6436bd4c842337b03e38919a  /tmp/source.zip" | sha256sum --check -
          rm -rf /tmp/source
          mkdir -p /tmp/source
          unzip -q /tmp/source.zip -d /tmp/source
          cp -a /tmp/source/. .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: ship Drillboard WebMCP exercise simulator"
          git push
